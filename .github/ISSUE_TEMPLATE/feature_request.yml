name: Feature request
description: Propose a scoped product or protocol improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: compatibility
    attributes:
      label: Protocol, privacy, and compatibility impact
      description: Explain effects on scopes, identities, storage, existing clients, or exported data.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not depend on publishing private data or credentials.
          required: true
